
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Üsküdar Teksifre Kiosk</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome en güncel kararlı sürüm -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body, #root { 
            height: 100%; 
            width: 100%; 
            overflow: hidden; 
            background-color: #2b59c3; 
        }
        body { 
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }
        /* İkonların ve metinlerin yüklenene kadar boş kalmaması için */
        #root:empty {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #2b59c3;
        }
        #root:empty::after {
            content: "";
            width: 80px;
            height: 80px;
            border: 10px solid rgba(255,255,255,0.1);
            border-top-color: #FFCC00;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        iframe { width: 100%; height: 100%; border: none; display: block; }
        ::-webkit-scrollbar { display: none; }
    </style>
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "@google/genai": "https://esm.sh/@google/genai@1.35.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/"
  }
}
</script>
</head>
<body>
    <div id="root"></div>
    <!-- Kiosk modunda imleci gizlemek isterseniz CSS'e cursor: none ekleyebilirsiniz -->
</body>
</html>
